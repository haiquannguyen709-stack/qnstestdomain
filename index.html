<style>

body.col #side{width:64px}body.col #side .lb{display:none}body.col main{margin-left:64px}
main{margin:60px 0 0 240px;padding:22px;transition:.2s}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}

.tw{background:#fff;border:1px solid var(--bd);border-radius:10px;overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:720px}th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--bd);vertical-align:top}th{background:#1565C0;font-size:13px;color:#FFFFFF;font-weight:700;white-space:nowrap}td.ac{white-space:nowrap}

<script>
/* ===== TIỆN ÍCH ===== */
const $=s=>document.querySelector(s),v=id=>(document.getElementById(id)||{}).value||'';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=t=>t?new Date(t).toLocaleString('vi-VN',{timeZone:'Asia/Ho_Chi_Minh'}):'Chưa có';
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d');
const hit=(q,...f)=>!q||f.some(x=>norm(x).includes(norm(q)));
const toast=(m,k='')=>{const d=document.createElement('div');d.className=k;d.textContent=m;$('#toast').appendChild(d);setTimeout(()=>d.remove(),3200)};
const STL={IN_PROGRESS:['Đang làm bài','#1565C0'],SUBMITTED:['Đã nộp bài','#2E7D32'],TIMEOUT:['Hết giờ','#E65100'],NONE:['Chưa bắt đầu','#90A4AE']};
const stl=s=>STL[s]||[s||'Chưa xác định','#78909C'];
const EVL={TAB_SWITCH:'Chuyển tab / rời trang thi',COPY:'Sao chép',CUT:'Cắt',PASTE:'Dán',CONTEXT_MENU:'Mở menu chuột phải',FULLSCREEN_EXIT:'Thoát toàn màn hình',FULLSCREEN_UNSUPPORTED:'Không hỗ trợ toàn màn hình'};
const PRI={COPY:'Cao',CUT:'Cao',PASTE:'Cao',TAB_SWITCH:'Trung bình',FULLSCREEN_EXIT:'Trung bình',CONTEXT_MENU:'Thấp',FULLSCREEN_UNSUPPORTED:'Thấp'};
const RV=['Chưa xem xét','Đã xem xét'];
const rvTxt=e=>e.rv?'Đã xem xét'+(e.rvAt?' lúc '+fmt(e.rvAt):'')+(e.rvBy?' bởi '+esc(e.rvBy):''):RV[0];
const tag=(t,c)=>`<span class="tag" style="--c:${c}">${esc(t)}</span>`;
const kv=o=>'<div class="kv">'+Object.entries(o).map(([k,x])=>`<span>${k}</span><div>${(x&&x.raw!==undefined)?x.raw:esc(x)}</div>`).join('')+'</div>';
const empty='<div class="empty">Không tìm thấy dữ liệu phù hợp với điều kiện hiện tại.</div>';

/* ===== DỮ LIỆU MẪU (GIẢ LẬP – KHÔNG PHẢI DỮ LIỆU THẬT) ===== */
const DemoDataService=(()=>{

const CLOCK_STALE_S=210;
const fmtClock=s=>(s==null||!isFinite(s)||s<0)?'Chưa xác định':Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
const clockGap=a=>a.tat?Math.max(0,(Date.now()+(ApiService.skew||0)-a.tat)/1000):0;
const clockText=a=>{const s=AttemptService.elapsedSec(a);let t=fmtClock(s);if(a.status=='IN_PROGRESS'&&s!=null){if(a.tst=='PAUSED')t+=' ⏸';else if(a.tst=='RUNNING'&&clockGap(a)>CLOCK_STALE_S)t+=' ⚠'}return t};

 elapsedSec(a){

data:{tab:'sum',title:'Dữ liệu thi',html:()=>'<div class="data-page">'+head('DỮ LIỆU THI','Tra cứu dữ liệu ghi nhận trong quá trình thi (chỉ xem, không chỉnh sửa)')+

 res(){const t=V.data.tab,A=id=>AttemptService.get(id),ok=a=>hit(v('q'),a.name,a.sbd,a.id)&&(!v('ex')||a.code==v('ex'));
  const logB=x=>{const m={SUBMIT:['#2E7D32','#E8F5E9'],AUTOSAVE:['#1565C0','#E8F1FC'],START:['#9A6700','#FFF4CC']}[x]||['#455A64','#ECEFF1'];return`<span class="data-badge" style="color:${m[0]};background-color:${m[1]}">${esc(x)}</span>`};
  const stB=x=>{const m={'ANSWERED':['#2E7D32','#E8F5E9'],'Đã trả lời':['#2E7D32','#E8F5E9'],'UNANSWERED':['#C62828','#FDECEC'],'Chưa trả lời':['#C62828','#FDECEC'],'PENDING':['#9A6700','#FFF4CC'],'Đang xử lý':['#9A6700','#FFF4CC'],'Chờ xử lý':['#9A6700','#FFF4CC']}[x]||['#455A64','#ECEFF1'];return`<span class="data-badge" style="color:${m[0]};background-color:${m[1]}">${esc(x)}</span>`};
  const typeB=x=>{const m={'ANSWER_CHANGE':['#1565C0','#E8F1FC'],'ANSWER_CLEAR':['#C62828','#FDECEC'],'SUBMIT':['#2E7D32','#E8F5E9'],'AUTOSAVE':['#6A1B9A','#F3E5F5'],'START':['#9A6700','#FFF4CC']}[x]||['#455A64','#ECEFF1'];return`<span class="data-badge" style="color:${m[0]};background-color:${m[1]}">${esc(x)}</span>`};
  let h;
  if(t=='sum')h=table(['Mã lượt thi','Họ và tên','Đề thi','Điểm tổng','Thời gian thi','Nộp bài','Trạng thái','Thao tác'],AttemptService.list().filter(ok).map(a=>[a.id,esc(a.name),a.code,a.score??'—',AttemptService.elapsed(a),fmt(a.submit),tag(stl(a.status)[0],stl(a.status)[1]),`<button class="btn sm btn-data-sum-view" onclick="showAtt('${a.id}')">Xem</button>`]),'d1');
  else if(t=='log')h=table(['Thời điểm','Mã lượt thi','Loại sự kiện','Số câu đã trả lời','Thao tác'],D().logs.filter(l=>ok(A(l.att))).sort((a,b)=>b.time-a.time).map(l=>[fmt(l.time),l.att,logB(l.type),l.cnt,`<button class="btn sm btn-data-log-view" onclick='showRec("Nhật ký đồng bộ",${JSON.stringify({'Mã nhật ký':l.id,'Lượt thi':l.att,'Thời điểm':fmt(l.time),'Loại':l.type,'Số câu':l.cnt})})'>Xem</button>`]),'d2');
  else h=table(['Lượt thi','Câu','Phần','Câu trả lời','Trạng thái','Thời điểm','Loại sự kiện'],D().det.filter(d=>ok(A(d.att))).map(d=>[d.att,d.q,d.part,d.ans,stB(d.st),fmt(d.time),typeB(d.type)]),'d3');
  $('#res').innerHTML=h}},

function go(k,pre){
 curKey=k; cur=V[k]; P={};
 try{sessionStorage.setItem('qn_cur_view',k)}catch(e){}
 
 // Xác định danh sách các mục hiển thị trên sidebar dựa theo vai trò người dùng
 let navKeys = [];
 if(currentUserRole === 'student'){
  navKeys = ['s_score', 's_sbd', 's_review'];
  if(!navKeys.includes(k)) { k = 's_score'; curKey = k; cur = V[k]; }
 } else {
  // Admin: hiển thị toàn bộ quản trị cũ + 3 mục mới
  navKeys = ['home', 'cand', 'mon', 'data', 'sec', 's_score', 's_sbd', 's_review'];
 }

 $('#navs').innerHTML = navKeys.map(x=>`<button class="nav ${x==k?'on':''}" title="${V[x].title}" onclick="go('${x}')"><span>${ICON[x]}</span><span class="lb">${V[x].title}</span></button>`).join('');
 $('#main').innerHTML = cur.html();
 if(k=='data') RemoteDataService.loadLogs().then(()=>cur.res()).catch(er=>toast(er.message,'e'));
 if(pre && pre.q && $('#q')) $('#q').value = pre.q;
 document.body.classList.remove('open');
 if(typeof cur.res === 'function') cur.res();
}

function candForm(id){const c=id?CandidateService.list().find(x=>x.cid==id):{name:'',sbd:'',code:'',room:'',council:''};window._eid=id||'';

/* ===== CỔNG THÍ SINH: TRA CỨU ĐIỂM / SỐ BÁO DANH / PHÚC KHẢO (KẾT NỐI APPS SCRIPT) ===== */
const _pubBusy = {};
const pubBox = (id, html) => { const b = document.getElementById(id); if (b) b.innerHTML = html; };
const pubState = (cls, text) => `<div class="portal-state ${cls}">${esc(text)}</div>`;
const pubInvalid = () => Object.assign(new Error('Máy chủ trả về dữ liệu không hợp lệ.'), { kind: 'invalid' });
const pubFail = e => {
  const net = e && (e.kind === 'network' || e.kind === 'invalid' || e.kind === 'config');
  return pubState('err', (e && e.message) || 'Đã xảy ra lỗi. Vui lòng thử lại.') +
    `<div style="color:var(--mu);font-size:13px">${net ? 'Thông tin bạn đã nhập vẫn được giữ nguyên, hãy bấm nút để thử lại.' : 'Vui lòng kiểm tra lại thông tin đã nhập.'}</div>`;
};

// Chạy 1 yêu cầu: chặn bấm nhiều lần, khóa nút, hiện trạng thái đang xử lý, bắt mọi lỗi.
async function pubRun(key, btnSel, boxId, loadingText, job) {
  if (_pubBusy[key]) return;
  _pubBusy[key] = true;
  const btn = document.querySelector(btnSel);
  const oldText = btn ? btn.textContent : '';
  if (btn) { btn.disabled = true; btn.textContent = 'Đang xử lý…'; }
  pubBox(boxId, pubState('info', loadingText));
  try { await job(); }
  catch (e) { pubBox(boxId, pubFail(e)); }
  finally { _pubBusy[key] = false; if (btn) { btn.disabled = false; btn.textContent = oldText; } }
}

/* ----- 1. TRA CỨU ĐIỂM ----- */
function renderScoreResult(r) {
  if (!r.found) return pubState('warn', r.message || 'Không tìm thấy dữ liệu phù hợp.');
  const d = r.data;
  if (!d || typeof d !== 'object') throw pubInvalid();
  const info = kv({ 'Mã đề thi': d.examCode, 'Tên đề thi': d.examName || '—', 'Số báo danh': d.sbd, 'Phòng thi': d.room, 'Trạng thái bài thi': stl(d.status)[0] });
  if (d.state === 'SCORE_AVAILABLE') {
    return pubState('ok', r.message || 'Đã tìm thấy kết quả thi.') +
      `<div class="portal-score"><span>Điểm thi</span><b>${esc(d.score)}</b></div>` + info;
  }
  if (d.state === 'NO_SCORE') return pubState('warn', r.message) + info;
  if (d.state === 'NOT_COMPLETED' || d.state === 'NO_ATTEMPT') return pubState('info', r.message) + info;
  throw pubInvalid();
}

  if (!name || !phone || !content || !reason) { errBox.textContent = 'Vui lòng điền đầy đủ các trường bắt buộc.'; return; }
  if (!/^[0-9+().\s-]{8,20}$/.test(phone)) { errBox.textContent = 'Số điện thoại không hợp lệ.'; return; }
  if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { errBox.textContent = 'Email không hợp lệ.'; return; }
  if (!agree) { errBox.textContent = 'Bạn phải xác nhận cam kết thông tin là chính xác trước khi gửi.'; return; }

  errBox.textContent = '';
  _rvSending = true;
  const sendBtn = $('#m_rev_send');
  if (sendBtn) { sendBtn.disabled = true; sendBtn.textContent = 'Đang gửi…'; }
  try {
    const r = await ApiService.callPublic('PUBLIC_SUBMIT_REVIEW', {
      examCode: _rvTarget.code, sbd: _rvTarget.sbd, room: _rvTarget.room,
      fullName: name, phone: phone, email: email, content: content, reason: reason, agree: true
    });
    const d = r.data;
    if (!r.found || !d || !d.reviewRequestId) throw Object.assign(new Error('Chưa xác nhận được việc tiếp nhận yêu cầu. Vui lòng thử lại.'), { kind: 'invalid' });
    const done = kv({ 'Mã yêu cầu phúc khảo': d.reviewRequestId, 'Thời điểm tiếp nhận': d.createdAt || '—', 'Trạng thái': 'Đã tiếp nhận' });
    _rvTarget = null;
    openM(`<h2>ĐÃ TIẾP NHẬN YÊU CẦU PHÚC KHẢO</h2>${pubState('ok', r.message || 'Yêu cầu của bạn đã được ghi nhận.')}${done}
      <p style="color:var(--mu);font-size:13px">Vui lòng lưu lại mã yêu cầu để đối chiếu khi cần.</p>
      <div class="mf"><button class="btn p" onclick="closeM()">Đóng</button></div>`);
    pubBox('review_status_container', pubState('ok', 'Yêu cầu phúc khảo đã được gửi. Mã yêu cầu: ' + d.reviewRequestId));
  } catch (e) {
    const m = $('#m_rev_err'); // giữ nguyên hộp thoại và dữ liệu đã nhập để thí sinh gửi lại
    if (m) m.textContent = (e && e.message) || 'Gửi yêu cầu thất bại. Vui lòng thử lại.';
    const b = $('#m_rev_send');
    if (b) { b.disabled = false; b.textContent = 'Gửi yêu cầu phúc khảo'; }
  } finally {
    _rvSending = false;
  }
}

/* ===== ĐĂNG NHẬP / ĐIỀU HƯỚNG ===== */
function doLogin(e){e.preventDefault();const u=v('u').trim(),p=v('p');
 if(!u||!p){$('#le').textContent='Vui lòng nhập tài khoản và mật khẩu.';return false}
 $('#le').textContent='Đang đăng nhập…';
 
 // Phân luồng: tài khoản khác đúng chữ "Admin" -> giao diện Học viên (chỉ phân luồng giao diện, KHÔNG phải xác thực)
 if(u !== 'Admin'){
   if(u.length < 2 || p.length < 2){$('#le').textContent='Tài khoản và mật khẩu cần có ít nhất 2 ký tự.';return false}
  setTimeout(()=>{
   $('#le').textContent='';
   $('#login').classList.add('hide');
   $('#app').classList.remove('hide');
   document.body.classList.add('student-portal');
   // Cập nhật nhãn vai trò trên thanh tiêu đề thành Học sinh
   const userSpan = document.querySelector('#top span[title="Tài khoản đang đăng nhập"]');
   if(userSpan) userSpan.textContent = '👤 Học viên';
   currentUserRole = 'student';
   try{sessionStorage.setItem('qn_user_role','student');sessionStorage.setItem('qn_student_user',u);}catch(ex){}
   go('s_score');
  }, 300);
  return false;
 }

 AuthService.login(u,p).then(()=>{
  try{
   sessionStorage.setItem('qn_admin_cred',JSON.stringify({u,p}));
   sessionStorage.setItem('qn_user_role','admin');
  }catch(ex){}
  currentUserRole = 'admin';
  const userSpan = document.querySelector('#top span[title="Tài khoản đang đăng nhập"]');
  if(userSpan) userSpan.textContent = '👤 Admin';
  document.body.classList.remove('student-portal');
  return RemoteDataService.loadAll();
 }).then(()=>{$('#le').textContent='';$('#login').classList.add('hide');$('#app').classList.remove('hide');const savedKey=sessionStorage.getItem('qn_cur_view');go((savedKey&&V[savedKey])?savedKey:'home');startAuto();startClock()}).catch(er=>{$('#le').textContent=er.message});return false}
function doLogout(){
 AuthService.logout();
 currentUserRole = 'admin';
 document.body.classList.remove('student-portal');
 try{
  sessionStorage.removeItem('qn_admin_cred');
  sessionStorage.removeItem('qn_cur_view');
  sessionStorage.removeItem('qn_user_role');
  sessionStorage.removeItem('qn_student_user');
 }catch(e){}
 stopAuto(); stopClock();
 $('#app').classList.add('hide');
 $('#login').classList.remove('hide');
 $('#p').value = '';
 $('#u').value = '';
 $('#le').textContent = '';
 closeM();
}
const toggleSide=()=>innerWidth<=760?document.body.classList.toggle('open'):document.body.classList.toggle('col');
document.addEventListener('keydown',e=>{if(e.key=='Escape')closeM()});

/* Khôi phục phiên đăng nhập hợp lệ khi tải lại trang (F5 / Ctrl+R) */
async function initSession(){
 try{
  const c=JSON.parse(sessionStorage.getItem('qn_admin_cred')||'null');
  if(!c||!c.u||!c.p)return;
  ApiService.cred=c;
  await ApiService.call('ADMIN_LOGIN');
  await RemoteDataService.loadAll();
  $('#login').classList.add('hide');
  $('#app').classList.remove('hide');
  const savedKey=sessionStorage.getItem('qn_cur_view');
  go((savedKey&&V[savedKey])?savedKey:'mon');
  startAuto();
  startClock();
 }catch(e){
  AuthService.logout();
  try{sessionStorage.removeItem('qn_admin_cred');sessionStorage.removeItem('qn_cur_view')}catch(ex){}
 }
}
if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',initSession);}else{initSession();}
