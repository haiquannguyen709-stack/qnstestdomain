<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quân Nguyễn Study – Quản trị thi</title>
<style>
:root{--b:#1565C0;--bl:#E3F2FD;--bg:#F5F7FA;--t:#263238;--g:#2E7D32;--o:#F39C12;--r:#D32F2F;--bd:#E0E6ED;--mu:#78909C}
*{box-sizing:border-box}body{margin:0;font:14px/1.5 "Be Vietnam Pro","Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--t)}
button,input,select{font:inherit}.hide{display:none!important}
.btn{border:1px solid var(--bd);background:#fff;color:var(--t);padding:7px 12px;border-radius:8px;cursor:pointer;transition:.15s}.btn:hover{border-color:var(--b);color:var(--b)}.btn:disabled{opacity:.4;cursor:default}
.btn.p{background:var(--b);border-color:var(--b);color:#fff}.btn.p:hover{background:#0D47A1;color:#fff}.btn.d{color:var(--r)}.btn.sm{padding:3px 9px;font-size:13px}
input,select{border:1px solid var(--bd);border-radius:8px;padding:8px 10px;background:#fff;color:var(--t);min-width:0}input:focus,select:focus{outline:2px solid var(--bl);border-color:var(--b)}
#login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#0D47A1,#1565C0 55%,#42A5F5);padding:16px}
.lbox{background:#fff;border-radius:14px;padding:32px;width:100%;max-width:380px;box-shadow:0 20px 50px #0004}
.logo{font-weight:800;color:var(--b);font-size:20px;letter-spacing:.3px}.lbox h2{margin:6px 0 18px;font-size:16px;font-weight:500;color:var(--mu)}
.lbox label{display:block;margin:12px 0 4px;font-weight:600}.pw{display:flex;gap:6px}.pw input{flex:1}.err{color:var(--r);min-height:20px;margin-top:10px}
#top{position:fixed;inset:0 0 auto 0;height:60px;background:#1565C0;color:#fff;display:flex;align-items:center;gap:14px;padding:0 16px;z-index:20;box-shadow:0 1px 4px rgba(0,0,0,0.1)}
#top b{font-size:20px}#top .sp{flex:1}#top button{background:#ffffff22;border:0;color:#fff;border-radius:8px;padding:8px 12px;cursor:pointer}#top button:hover{background:#ffffff44}
#side{position:fixed;top:60px;bottom:0;left:0;width:240px;background:#fff;border-right:1px solid var(--bd);padding:14px 10px;z-index:15;transition:.2s;overflow:auto;display:flex;flex-direction:column}
#side .sidebar-brand{padding:6px 12px 14px;border-bottom:1px solid var(--bd);margin-bottom:10px;text-align:center}
.nav{display:flex;gap:10px;align-items:center;width:100%;border:0;background:none;padding:11px 12px;border-radius:8px;cursor:pointer;text-align:left;color:var(--t);border-left:4px solid transparent;margin:2px 0}
.nav:hover{background:var(--bg)}.nav.on{background:var(--bl);color:#0D47A1;font-weight:700;border-left-color:var(--b)}
body.col #side{width:64px}body.col #side .lb{display:none}body.col main{margin-left:64px}
main{margin:60px 0 0 240px;padding:22px;transition:.2s}
.hd{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;justify-content:space-between;margin-bottom:14px}.hd h1{margin:0;font-size:22px;color:#0D47A1}.hd p{margin:2px 0 0;color:var(--mu)}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}.bar input{flex:1;min-width:200px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.st{background:#fff;border:1px solid var(--bd);border-radius:10px;padding:12px 14px;border-top:4px solid var(--c)}.st b{font-size:26px;display:block;color:var(--c)}.st span{color:var(--mu);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.card{background:#fff;border:1px solid var(--bd);border-left:6px solid var(--c);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:6px;transition:.15s}.card:hover{box-shadow:0 4px 14px #1565C022}
.card h3{margin:0;font-size:15px}.card .k{color:var(--mu);font-size:13px}.card .row{display:flex;justify-content:space-between;gap:8px;font-size:13px}.card .ft{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:8px}
.candidate-card--in-progress{background-color:#EAF4FF}.candidate-card--completed{background-color:#E8F5E9}
.candidate-identification{color:#1565C0;font-weight:700;font-size:14px;line-height:1.4}
.candidate-info-label{color:var(--t);font-weight:400}
.candidate-info-value{color:#1565C0;font-weight:700}
.btn-card{display:inline-flex;align-items:center;justify-content:center;padding:8px 16px;min-height:38px;font-size:14px;font-weight:700;border-radius:10px;cursor:pointer;transition:.15s;border:1px solid transparent;line-height:1.2}
.btn-card-primary{background:var(--b);color:#fff;border-color:var(--b)}.btn-card-primary:hover{background:#0D47A1;border-color:#0D47A1}
.btn-card-warn{background:#FFF5F5;color:var(--r);border-color:#FFCDD2}.btn-card-warn:hover{background:#FFEBEE;border-color:var(--r)}
.tag{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:700;color:var(--c);background:color-mix(in srgb,var(--c) 14%,#fff);white-space:nowrap}
.tw{background:#fff;border:1px solid var(--bd);border-radius:10px;overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:720px}th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--bd);vertical-align:top}th{background:#1565C0;font-size:13px;color:#FFFFFF;font-weight:700;white-space:nowrap}td.ac{white-space:nowrap}
tbody tr:nth-child(odd){background-color:#FFFFFF}
tbody tr:nth-child(even){background-color:#E7F1FF}
.candidate-name{color:#1565C0;font-weight:400}
.candidate-sbd{color:#1565C0;font-weight:700}
.candidate-exam-code{color:#1565C0;font-weight:400}
.candidate-action-btn{display:inline-block;padding:4px 10px;font-size:13px;font-weight:700;border-radius:6px;border:1px solid transparent;cursor:pointer;transition:all .15s ease;line-height:1.2}
.candidate-action-view{background-color:#E7F1FF;color:#1565C0;border-color:#1565C0}
.candidate-action-view:hover{background-color:#1565C0;color:#FFFFFF}
.candidate-action-edit{background-color:#1565C0;color:#FFFFFF;border-color:#1565C0}
.candidate-action-edit:hover{background-color:#0D47A1;border-color:#0D47A1}
.candidate-action-delete{background-color:#FDECEC;color:#C62828;border-color:#F5C6CB}
.candidate-action-delete:hover{background-color:#C62828;color:#FFFFFF;border-color:#C62828}
.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;padding:10px 4px;color:var(--mu)}.empty{padding:36px;text-align:center;color:var(--mu);background:#fff;border:1px dashed var(--bd);border-radius:10px}
.tabs{display:flex;gap:6px;margin-bottom:12px}.tabs .btn.on{background:var(--b);color:#fff;border-color:var(--b)}
#mask{position:fixed;inset:0;background:#0007;display:none;place-items:center;z-index:50;padding:14px}#mask.on{display:grid}
.modal{background:#fff;border-radius:12px;width:100%;max-width:640px;max-height:90vh;overflow:auto;padding:20px}.modal h2{margin:0 0 12px;color:#0D47A1;font-size:18px}.modal h4{margin:14px 0 4px;color:var(--b)}
.kv{display:grid;grid-template-columns:150px 1fr;gap:3px 10px;font-size:13px}.kv span{color:var(--mu)}.fm label{display:block;margin:10px 0 3px;font-weight:600}.fm input,.fm select{width:100%}.mf{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
#toast{position:fixed;right:16px;bottom:16px;z-index:60;display:flex;flex-direction:column;gap:8px}#toast div{background:var(--t);color:#fff;padding:10px 16px;border-radius:8px;border-left:5px solid var(--g)}#toast .e{border-color:var(--r)}#toast .w{border-color:var(--o)}
.note{background:#FFF8E1;border:1px solid #FFE082;border-radius:8px;padding:6px 12px;font-size:12px;margin-bottom:12px}
@media(max-width:1100px){.grid{grid-template-columns:repeat(2,1fr)}}
#top .menu-btn{display:none}
@media(max-width:760px){#top .menu-btn{display:block}.grid{grid-template-columns:1fr}#side{transform:translateX(-100%);width:240px!important}body.open #side{transform:none}main,body.col main{margin-left:0;padding:14px}#top b{font-size:17px}.kv{grid-template-columns:1fr}}

/* Nút Thao tác trong mục Dữ liệu thi */
.data-page .btn-data-sum-view { background-color: #1565C0 !important; color: #FFFFFF !important; font-weight: 700 !important; border: 1px solid #1565C0 !important; border-radius: 6px; padding: 4px 10px; cursor: pointer; transition: all 0.15s ease; line-height: 1.2; }

.data-page .btn-data-log-view:hover { background-color: #4A148C !important; border-color: #4A148C !important; color: #FFFFFF !important; }

 <header id="top"><button class="menu-btn" title="Thu gọn / mở menu" onclick="toggleSide()">☰</button><b>Quân Nguyễn Study</b><span class="sp"></span>

<script>
/* ===== TIỆN ÍCH ===== */
const $=s=>document.querySelector(s),v=id=>(document.getElementById(id)||{}).value||'';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=t=>t?new Date(t).toLocaleString('vi-VN',{timeZone:'Asia/Ho_Chi_Minh'}):'Chưa có';
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d');
const hit=(q,...f)=>!q||f.some(x=>norm(x).includes(norm(q)));
const toast=(m,k='')=>{const d=document.createElement('div');d.className=k;d.textContent=m;$('#toast').appendChild(d);setTimeout(()=>d.remove(),3200)};
const STL={IN_PROGRESS:['Đang làm bài','#1565C0'],SUBMITTED:['Đã nộp bài','#2E7D32'],TIMEOUT:['Hết giờ','#E65100'],NONE:['Chưa bắt đầu','#90A4AE']};
const stl=s=>STL[s]||[s||'Chưa xác định','#78909C'];
const EVL={TAB_SWITCH:'Chuyển tab / rời trang thi',COPY:'Sao chép',CUT:'Cắt',PASTE:'Dán',CONTEXT_MENU:'Mở menu chuột phải',FULLSCREEN_EXIT:'Thoát toàn màn hình',FULLSCREEN_UNSUPPORTED:'Không hỗ trợ toàn màn hình'};
const PRI={COPY:'Cao',CUT:'Cao',PASTE:'Cao',TAB_SWITCH:'Trung bình',FULLSCREEN_EXIT:'Trung bình',CONTEXT_MENU:'Thấp',FULLSCREEN_UNSUPPORTED:'Thấp'};
const RV=['Chưa xem xét','Đã xem xét'];
const rvTxt=e=>e.rv?'Đã xem xét'+(e.rvAt?' lúc '+fmt(e.rvAt):'')+(e.rvBy?' bởi '+esc(e.rvBy):''):RV[0];
const tag=(t,c)=>`<span class="tag" style="--c:${c}">${esc(t)}</span>`;
const kv=o=>'<div class="kv">'+Object.entries(o).map(([k,x])=>`<span>${k}</span><div>${(x&&x.raw!==undefined)?x.raw:esc(x)}</div>`).join('')+'</div>';
const empty='<div class="empty">Không tìm thấy dữ liệu phù hợp với điều kiện hiện tại.</div>';

/* ===== DỮ LIỆU MẪU (GIẢ LẬP – KHÔNG PHẢI DỮ LIỆU THẬT) ===== */
const DemoDataService=(()=>{
 const KEY='qn_demo_v1',NOW=Date.now(),M=6e4,ago=m=>m==null?null:NOW-m*M;
 const EX={A101:{n:'Toán – Đề thi thử THPTQG',lim:90,tot:22},B201:{n:'Vật lí – Đề thi thử THPTQG',lim:50,tot:28},C301:{n:'Hóa học – Đề thi thử THPTQG',lim:50,tot:28}};
 //code,họ tên,sbd,phòng,trường,bắt đầu(phút trước),đồng bộ(phút trước),trạng thái,số câu,điểm
 const R=[['A101','Nguyễn Văn An','001','P01','THPT Cầu Giấy',30,0,'IN_PROGRESS',12,null],['A101','Trần Thị Bình','002','P01','THPT Cầu Giấy',45,1,'IN_PROGRESS',18,null],
 ['A101','Lê Hoàng Cường','003','P02','THPT Yên Hòa',200,150,'SUBMITTED',22,8.5],['B201','Phạm Minh Dũng','004','P02','THPT Yên Hòa',70,40,'TIMEOUT',20,5.25],
 ['B201','Võ Thu Hà','005','P01','THPT Cầu Giấy',20,0,'IN_PROGRESS',9,null],['B201','Đỗ Quang Huy','006','P03','THPT Nhân Chính',120,80,'SUBMITTED',28,9],
 ['C301','Bùi Lan Khanh','007','P03','THPT Nhân Chính',55,3,'IN_PROGRESS',15,null],['C301','Hồ Gia Linh','008','P02','THPT Yên Hòa',null,null,'IN_PROGRESS',0,null],
 ['C301','Ngô Đức Mạnh','009','P01','THPT Cầu Giấy',100,60,'SUBMITTED',28,7.75]];
 //lượt thi, loại, phút trước, câu, chi tiết, đã xem xét
 const S=[[1,'TAB_SWITCH',12,'5','Trang thi bị ẩn (visibilityState=hidden)',0],[4,'FULLSCREEN_EXIT',8,'3','Thoát chế độ toàn màn hình',0],[4,'TAB_SWITCH',6,'4','Trang thi bị ẩn',0],[8,'COPY',70,'11','Sao chép nội dung câu hỏi',1],[0,'CONTEXT_MENU',20,'2','Mở menu chuột phải',0]];
 const mk=()=>{

   return[i+1,displayCid,`<span class="candidate-name">${esc(c.name)}</span>`,`<span class="candidate-sbd">${esc(c.sbd)}</span>`,esc(c.room||'—'),esc(c.council||'—'),`<span class="candidate-exam-code">${esc(c.code)}</span>`,esc(MockDataService.EX[c.code].n),tag(stl(s)[0],stl(s)[1]),`<span class="ac"><button class="candidate-action-btn candidate-action-view" onclick="candView('${c.cid}')">Xem</button> <button class="candidate-action-btn candidate-action-edit" onclick="candForm('${c.cid}')">Sửa</button> <button class="candidate-action-btn candidate-action-delete" onclick="candDel('${c.cid}')">Xóa</button></span>`]}),'cand')}},

mon:{title:'Giám sát thi',html:()=>'<div class="mon-page">'+head('GIÁM SÁT THI','Danh sách lượt thi và tiến trình làm bài (dữ liệu giả lập)')+toolbar()+'<div id="res"></div></div>',
 res(){$('#res').innerHTML=table(['Mã lượt thi','Tên đề thi','Họ và tên','SBD','Phòng','Bắt đầu','Đồng bộ gần nhất','Số câu','Trạng thái','Cảnh báo','Thao tác'],filterAtt().map(a=>[a.id,esc(a.exam),esc(a.name),a.sbd,a.room,fmt(a.start),fmt(a.sync),a.ans+'/'+a.tot,tag(stl(a.status)[0],stl(a.status)[1]),a.warn?tag(a.warn+' chưa xem xét','#F39C12'):'—',`<button class="btn sm btn-mon-detail" onclick="showAtt('${a.id}')">Chi tiết</button>`]),'mon')}},

data:{tab:'sum',title:'Dữ liệu thi',html:()=>'<div class="data-page">'+head('DỮ LIỆU THI','Tra cứu dữ liệu ghi nhận trong quá trình thi (chỉ xem, không chỉnh sửa)')+
 `<div class="tabs">${[['sum','Tổng hợp bài thi'],['log','Nhật ký đồng bộ'],['det','Chi tiết đáp án']].map(t=>`<button class="btn ${V.data.tab==t[0]?'on':''}" onclick="V.data.tab='${t[0]}';P={};go('data')">${t[1]}</button>`).join('')}</div>
 <div class="bar"><input id="q" placeholder="Tìm theo tên, SBD, mã lượt thi…" oninput="rs()"><select id="ex" onchange="rs()">${opts(EXO(),'Tất cả mã đề')}</select></div><div id="res"></div></div>`,
 res(){const t=V.data.tab,A=id=>AttemptService.get(id),ok=a=>hit(v('q'),a.name,a.sbd,a.id)&&(!v('ex')||a.code==v('ex'));
  const logB=x=>{const m={SUBMIT:['#2E7D32','#E8F5E9'],AUTOSAVE:['#1565C0','#E8F1FC'],START:['#9A6700','#FFF4CC']}[x]||['#455A64','#ECEFF1'];return`<span class="data-badge" style="color:${m[0]};background-color:${m[1]}">${esc(x)}</span>`};
  const stB=x=>{const m={'ANSWERED':['#2E7D32','#E8F5E9'],'Đã trả lời':['#2E7D32','#E8F5E9'],'UNANSWERED':['#C62828','#FDECEC'],'Chưa trả lời':['#C62828','#FDECEC'],'PENDING':['#9A6700','#FFF4CC'],'Đang xử lý':['#9A6700','#FFF4CC'],'Chờ xử lý':['#9A6700','#FFF4CC']}[x]||['#455A64','#ECEFF1'];return`<span class="data-badge" style="color:${m[0]};background-color:${m[1]}">${esc(x)}</span>`};
  const typeB=x=>{const m={'ANSWER_CHANGE':['#1565C0','#E8F1FC'],'ANSWER_CLEAR':['#C62828','#FDECEC'],'SUBMIT':['#2E7D32','#E8F5E9'],'AUTOSAVE':['#6A1B9A','#F3E5F5'],'START':['#9A6700','#FFF4CC']}[x]||['#455A64','#ECEFF1'];return`<span class="data-badge" style="color:${m[0]};background-color:${m[1]}">${esc(x)}</span>`};
  let h;
  if(t=='sum')h=table(['Mã lượt thi','Họ và tên','Đề thi','Điểm tổng','Thời gian thi','Nộp bài','Trạng thái','Thao tác'],AttemptService.list().filter(ok).map(a=>[a.id,esc(a.name),a.code,a.score??'—',AttemptService.elapsed(a),fmt(a.submit),tag(stl(a.status)[0],stl(a.status)[1]),`<button class="btn sm btn-data-sum-view" onclick="showAtt('${a.id}')">Xem</button>`]),'d1');
  else if(t=='log')h=table(['Thời điểm','Mã lượt thi','Loại sự kiện','Số câu đã trả lời','Thao tác'],D().logs.filter(l=>ok(A(l.att))).sort((a,b)=>b.time-a.time).map(l=>[fmt(l.time),l.att,logB(l.type),l.cnt,`<button class="btn sm btn-data-log-view" onclick='showRec("Nhật ký đồng bộ",${JSON.stringify({'Mã nhật ký':l.id,'Lượt thi':l.att,'Thời điểm':fmt(l.time),'Loại':l.type,'Số câu':l.cnt})})'>Xem</button>`]),'d2');
  else h=table(['Lượt thi','Câu','Phần','Câu trả lời','Trạng thái','Thời điểm','Loại sự kiện'],D().det.filter(d=>ok(A(d.att))).map(d=>[d.att,d.q,d.part,d.ans,stB(d.st),fmt(d.time),typeB(d.type)]),'d3');
  $('#res').innerHTML=h}},

sec:{title:'Kiểm soát gian lận',html:()=>'<div class="fraud-page">'+head('KIỂM SOÁT GIAN LẬN','Các sự kiện bảo mật ghi nhận – đây là dấu hiệu cần kiểm tra, chưa phải kết luận gian lận')+
 '<div class="note">Mức ưu tiên chỉ là giá trị mẫu. Trạng thái xem xét được lưu trong sheet SecurityLogs.</div><div class="stats" id="stats"></div>'+
 `<div class="bar"><input id="q" placeholder="Tìm theo họ tên hoặc SBD…" oninput="rs()"><select id="ty" onchange="rs()">${opts(Object.entries(EVL),'Tất cả loại sự kiện')}</select><select id="ex" onchange="rs()">${opts(EXO(),'Tất cả đề thi')}</select></div><div id="res"></div></div>`,
 res(){const S=SecurityService.all();$('#stats').innerHTML=[['Tổng sự kiện bảo mật',S.length,'#1565C0'],['Lượt thi còn cảnh báo',new Set(S.filter(s=>!s.rv).map(s=>s.att)).size,'#F39C12'],['Chưa xem xét',S.filter(s=>!s.rv).length,'#D32F2F'],['Đã xem xét',S.filter(s=>s.rv).length,'#2E7D32']].map(x=>`<div class="st" style="--c:${x[2]}"><b>${x[1]}</b><span>${x[0]}</span></div>`).join('');
  const L=S.filter(s=>{const a=AttemptService.get(s.att);return hit(v('q'),a.name,a.sbd)&&(!v('ty')||s.type==v('ty'))&&(!v('ex')||a.code==v('ex'))});
  $('#res').innerHTML=table(['Thời gian','Họ và tên','SBD','Đề thi','Loại sự kiện','Câu','Ưu tiên (mẫu)','Nội dung','Xem xét','Thao tác'],L.map(s=>{const a=AttemptService.get(s.att);
   return[fmt(s.time),esc(a.name),a.sbd,a.code,EVL[s.type],s.q,tag(PRI[s.type],{Cao:'#D32F2F','Trung bình':'#F39C12',Thấp:'#78909C'}[PRI[s.type]]),esc(s.detail),tag(RV[s.rv],s.rv?'#2E7D32':'#F39C12'),
   `<span class="ac"><button class="btn sm btn-sec-profile" onclick="showAtt('${a.id}')">Hồ sơ</button> <button class="btn sm btn-sec-history" onclick="secHist('${a.id}')">Lịch sử</button> ${s.rv?'':`<button class="btn sm btn-sec-reviewed" onclick="doReview('${s.id}',this)">Đã xem xét</button>`}</span>`]}),'sec')}}
};
const ICON={home:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg>',cand:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>',mon:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>',data:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"></ellipse><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path></svg>',sec:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path><path d="m9 12 2 2 4-4"></path></svg>'};let cur=V.home,curKey='home';
function go(k,pre){curKey=k;cur=V[k];P={};try{sessionStorage.setItem('qn_cur_view',k)}catch(e){}$('#navs').innerHTML=Object.keys(V).map(x=>`<button class="nav ${x==k?'on':''}" title="${V[x].title}" onclick="go('${x}')"><span>${ICON[x]}</span><span class="lb">${V[x].title}</span></button>`).join('');
 $('#main').innerHTML=cur.html();if(k=='data')RemoteDataService.loadLogs().then(()=>cur.res()).catch(er=>toast(er.message,'e'));if(pre&&pre.q)$('#q').value=pre.q;document.body.classList.remove('open');cur.res()}
const refresh=async()=>{toast('Đang tải dữ liệu…');try{await RemoteDataService.loadCore();if(curKey=='cand'||curKey=='data')await RemoteDataService.loadCands();if(curKey=='data')await RemoteDataService.loadLogs(true);cur.res();toast('Đã làm mới dữ liệu')}catch(e){toast(e.message,'e')}};

/* ===== THÍ SINH: THÊM / SỬA / XÓA / CSV ===== */
function candView(id){const c=CandidateService.list().find(x=>x.cid==id);showRec('Thông tin thí sinh',{'Mã thí sinh':c.cid,'Họ và tên':c.name,'Số báo danh':c.sbd,'Mã đề':c.code,'Phòng thi':c.room||'Chưa có','Hội đồng thi':c.council||'Chưa có','Trạng thái':stl(CandidateService.status(c))[0]})}
let _saving=false;
function candForm(id){const c=id?CandidateService.list().find(x=>x.cid==id):{name:'',sbd:'',code:'',room:'',council:''};window._eid=id||'';
 openM(`<h2>${id?'Chỉnh sửa':'Thêm'} thí sinh</h2><div class="fm"><label>Họ và tên thí sinh *</label><input id="f_name" value="${esc(c.name)}"><label>Số báo danh *</label><input id="f_sbd" value="${esc(c.sbd)}"><label>Đề thi *</label><select id="f_code">${EXO().map(e=>`<option value="${esc(e[0])}" ${e[0]==c.code?'selected':''}>${esc(e[1])}</option>`).join('')}</select><label>Phòng thi *</label><input id="f_room" value="${esc(c.room)}"><label>Hội đồng thi *</label><input id="f_council" value="${esc(c.council)}"></div>
 <div class="err" id="fe"></div><div class="mf"><button class="btn" onclick="closeM()">Hủy</button><button class="btn p" id="f_save" onclick="candSave()">Lưu</button></div>`)}
function candSave(){if(_saving)return;const c={name:v('f_name').trim(),sbd:v('f_sbd').trim(),code:v('f_code'),room:v('f_room').trim(),council:v('f_council').trim(),school:'',dob:''},e=CandidateService.validate(c,_eid);
 if(e)return $('#fe').textContent=e;
 _saving=true;$('#fe').textContent='';const sb=$('#f_save');sb.disabled=true;sb.textContent='Đang lưu…';
 CandidateService.upsert(c,_eid).then(()=>{closeM();rs();toast(_eid?'Đã cập nhật thí sinh':'Đã thêm thí sinh')}).catch(er=>{$('#fe').textContent=er.message}).finally(()=>{_saving=false;const x=$('#f_save');if(x){x.disabled=false;x.textContent='Lưu'}})}const candDel=id=>confirmM('Xóa thí sinh này khỏi danh sách được phép thi? Các lượt thi đã có không bị ảnh hưởng.',()=>{CandidateService.remove(id).then(()=>{rs();toast('Đã xóa thí sinh','w')}).catch(er=>toast(er.message,'e'))});
function exportCSV(){const rows=[['Mã thí sinh','Họ và tên','SBD','Mã đề','Phòng thi','Hội đồng thi']].concat(CandidateService.list().map(c=>[c.cid,c.name,c.sbd,c.code,c.room,c.council]));
 const blob=new Blob(['\ufeff'+rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\n')],{type:'text/csv;charset=utf-8'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='thi-sinh-mau.csv';a.click();toast('Đã xuất CSV từ dữ liệu mẫu')}
let _rvBusy=false;
async function doReview(id,btn){
 if(_rvBusy)return;_rvBusy=true;
 const old=btn?btn.textContent:'';
 if(btn){btn.disabled=true;btn.textContent='Đang lưu…'}
 try{await SecurityService.review(id);toast('Đã lưu trạng thái xem xét vào Google Sheets')}
 catch(er){toast(er.message||'Không lưu được trạng thái xem xét. Vui lòng thử lại.','e');if(btn){btn.disabled=false;btn.textContent=old}}
 finally{_rvBusy=false;cur.res()}
}
function secHist(id){const ev=SecurityService.byAtt(id),a=AttemptService.get(id);openM(`<h2>Lịch sử sự kiện – ${esc(a.name)}</h2>${ev.sort((x,y)=>y.time-x.time).map(e=>`<div>• ${fmt(e.time)} – ${EVL[e.type]} – câu ${e.q} (${rvTxt(e)})</div>`).join('')}<div class="mf"><button class="btn p" onclick="closeM()">Đóng</button></div>`)}

/* ===== ĐĂNG NHẬP / ĐIỀU HƯỚNG ===== */
function doLogin(e){e.preventDefault();const u=v('u').trim(),p=v('p');
 if(!u||!p){$('#le').textContent='Vui lòng nhập tài khoản và mật khẩu.';return false}
 $('#le').textContent='Đang đăng nhập…';
 AuthService.login(u,p).then(()=>{
  try{sessionStorage.setItem('qn_admin_cred',JSON.stringify({u,p}))}catch(ex){}
  return RemoteDataService.loadAll();
 }).then(()=>{$('#le').textContent='';$('#login').classList.add('hide');$('#app').classList.remove('hide');const savedKey=sessionStorage.getItem('qn_cur_view');go((savedKey&&V[savedKey])?savedKey:'home');startAuto();startClock()}).catch(er=>{$('#le').textContent=er.message});return false}
function doLogout(){AuthService.logout();try{sessionStorage.removeItem('qn_admin_cred');sessionStorage.removeItem('qn_cur_view')}catch(e){}stopAuto();stopClock();$('#app').classList.add('hide');$('#login').classList.remove('hide');$('#p').value='';$('#le').textContent='';closeM()}
const toggleSide=()=>innerWidth<=760?document.body.classList.toggle('open'):document.body.classList.toggle('col');
document.addEventListener('keydown',e=>{if(e.key=='Escape')closeM()});

/* Khôi phục phiên đăng nhập hợp lệ khi tải lại trang (F5 / Ctrl+R) */
async function initSession(){
 try{
  const c=JSON.parse(sessionStorage.getItem('qn_admin_cred')||'null');
  if(!c||!c.u||!c.p)return;
  ApiService.cred=c;
  await ApiService.call('ADMIN_LOGIN');
  await RemoteDataService.loadAll();
  $('#login').classList.add('hide');
  $('#app').classList.remove('hide');
  const savedKey=sessionStorage.getItem('qn_cur_view');
  go((savedKey&&V[savedKey])?savedKey:'mon');
  startAuto();
  startClock();
 }catch(e){
  AuthService.logout();
  try{sessionStorage.removeItem('qn_admin_cred');sessionStorage.removeItem('qn_cur_view')}catch(ex){}
 }
}
if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',initSession);}else{initSession();}
</script></body></html>
